worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    
    # ==========================================
    # GZIP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        image/svg+xml;

    # ==========================================
    # CACHE
    # ==========================================
    proxy_cache_path C:/nginx-1.30.4/cache
    levels=1:2
    keys_zone=my_cache:10m
    max_size=100m
    inactive=60m
    use_temp_path=off;

    # ==========================================
    # UPSTREAM для read-only операций (GET)
    # ==========================================
    upstream backend_read {
        server 127.0.0.1:8080 weight=2;
        server 127.0.0.1:8081 weight=1;
        server 127.0.0.1:8082 weight=1;
    }

    # ==========================================
    # UPSTREAM для write операций (POST, PUT, DELETE)
    # ==========================================
    upstream backend_main {
        server 127.0.0.1:8080;
    }

    # ==========================================
    # MAP: выбираем бэкенд в зависимости от метода
    # ==========================================
    map $request_method $api_backend {
        default "backend_main";
        GET     "backend_read";
    }

    # ==========================================
    # HTTP -> HTTPS
    # ==========================================
    server {
        listen 80;
        server_name shop.local;

        return 301 https://shop.local$request_uri;
    }

    # ==========================================
    # HTTPS
    # ==========================================
    server {
        listen 443 ssl;
        server_name shop.local;

        ssl_certificate C:/nginx-1.30.4/ssl/shop.local.crt;
        ssl_certificate_key C:/nginx-1.30.4/ssl/shop.local.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # ==========================================
        # /api/v1/ - балансировка GET, остальное на 8080
        # ==========================================
        location /api/v1/ {
            proxy_pass http://$api_backend;

            add_header X-Upstream-Server $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite ^/api/(.*) /api/v1/$1 break;
            proxy_pass http://$api_backend;
    
            add_header X-Upstream-Server $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # /api/v1 -> Swagger
        # ==========================================
        location = /api/v1 {
            return 302 /swagger/index.html;
        }

        location = /api/v1/ {
            return 302 /swagger/index.html;
        }

        # ==========================================
        # Swagger UI
        # ==========================================
        location /swagger/ {
            proxy_pass http://127.0.0.1:8080;

            proxy_cache my_cache;
            proxy_cache_methods GET HEAD;

            proxy_cache_valid 200 10m;
            proxy_cache_valid 302 10m;
            proxy_cache_valid 404 1m;

            proxy_cache_key "$scheme$request_method$host$request_uri";

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # OpenAPI
        # ==========================================
        location /api-docs {
            proxy_pass http://127.0.0.1:8080;

            proxy_cache my_cache;
            proxy_cache_methods GET HEAD;

            proxy_cache_valid 200 10m;
            proxy_cache_valid 302 10m;
            proxy_cache_valid 404 1m;

            proxy_cache_key "$scheme$request_method$host$request_uri";

            add_header X-Cache-Status $upstream_cache_status always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # /admin -> /admin/
        # ==========================================
        location = /admin {
            return 301 /admin/;
        }

        # ==========================================
        # pgAdmin
        # ==========================================
      # ==========================================
# pgAdmin
# ==========================================
        location /admin/ {
            proxy_pass http://127.0.0.1:5050/;

            # Исправляем редиректы
            proxy_redirect http://127.0.0.1:5050/ /admin/;
            # proxy_redirect https://127.0.0.1:5050/ /admin/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Forwarded-Prefix /admin;
        }

        # ==========================================
        # Nginx status
        # ==========================================
        location = /status {
            stub_status;
            access_log off;
        }

        # ==========================================
        # Static
        # ==========================================
        location / {
            root C:/nginx-1.30.4/html;
            index index.html;
        }

        # ==========================================
        # Error pages
        # ==========================================
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root C:/nginx-1.30.4/html;
        }
    }
}